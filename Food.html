<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NaijaBite – Fresh Nigerian Dishes Delivered Fast</title>
<meta name="description" content="Order authentic Nigerian food online. Fast delivery, fresh ingredients, and the best jollof rice in town. NaijaBite brings Nigeria to your doorstep."/>
<meta name="keywords" content="Nigerian food delivery, Jollof rice, Egusi soup, order Nigerian food online, NaijaBite"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
:root {
  --green: #0A5C36;
  --green-light: #0e7a48;
  --green-dark: #073d25;
  --yellow: #FFB800;
  --yellow-light: #ffd166;
  --orange: #E65F00;
  --orange-light: #ff7a1a;
  --white: #FAFAFA;
  --gray: #f0ede8;
  --gray2: #e0dbd4;
  --dark: #1a1208;
  --text: #2d2416;
  --text-light: #6b5d4a;
  --radius: 18px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(10,92,54,0.13);
  --shadow-hover: 0 16px 48px rgba(10,92,54,0.22);
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--text); overflow-x: hidden; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--gray); }
::-webkit-scrollbar-thumb { background: var(--green); border-radius: 3px; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(10,92,54,0.97); backdrop-filter: blur(12px);
  padding: 0 5%; height: 68px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 20px rgba(0,0,0,0.18);
  transition: var(--transition);
}
.nav-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem; color: var(--yellow);
  letter-spacing: 2px; text-decoration: none;
  display: flex; align-items: center; gap: 8px;
}
.nav-logo span { color: var(--white); }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-links a {
  color: rgba(255,255,255,0.85); text-decoration: none;
  font-size: 0.9rem; font-weight: 500; letter-spacing: 0.3px;
  transition: var(--transition); position: relative;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -3px; left: 0; width: 0; height: 2px;
  background: var(--yellow); transition: var(--transition);
}
.nav-links a:hover { color: var(--yellow); }
.nav-links a:hover::after { width: 100%; }
.nav-actions { display: flex; align-items: center; gap: 12px; }
.btn-nav { padding: 9px 20px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: var(--transition); border: none; }
.btn-login { background: transparent; color: var(--yellow); border: 1.5px solid var(--yellow); }
.btn-login:hover { background: var(--yellow); color: var(--dark); }
.btn-signup { background: var(--orange); color: white; }
.btn-signup:hover { background: var(--orange-light); transform: translateY(-1px); }
.cart-btn {
  background: rgba(255,184,0,0.15); border: 1.5px solid var(--yellow);
  color: var(--yellow); padding: 9px 16px; border-radius: 50px;
  cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: var(--transition);
  display: flex; align-items: center; gap: 6px; position: relative;
}
.cart-btn:hover { background: var(--yellow); color: var(--dark); }
.cart-count {
  background: var(--orange); color: white; border-radius: 50%;
  width: 18px; height: 18px; font-size: 0.65rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
.hamburger span { width: 24px; height: 2px; background: var(--yellow); border-radius: 2px; transition: var(--transition); }

#hero {
  min-height: 100vh; background: var(--green-dark);
  display: flex; align-items: center; position: relative; overflow: hidden;
  padding: 100px 5% 60px;
}
.hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background: 
    radial-gradient(ellipse 70% 70% at 70% 50%, rgba(255,184,0,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 20% 80%, rgba(230,95,0,0.06) 0%, transparent 70%),
    linear-gradient(135deg, #073d25 0%, #0A5C36 50%, #0e7a48 100%);
}
.hero-pattern {
  position: absolute; inset: 0; z-index: 0; opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FFB800' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.hero-content { position: relative; z-index: 2; max-width: 580px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,184,0,0.15); border: 1px solid rgba(255,184,0,0.4);
  color: var(--yellow); padding: 8px 16px; border-radius: 50px;
  font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px;
  margin-bottom: 24px; animation: fadeInUp 0.6s ease both;
}
.hero-badge::before { content: '🍛'; font-size: 1rem; }
.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.8rem, 5.5vw, 4.2rem); font-weight: 900;
  line-height: 1.1; color: var(--white);
  margin-bottom: 20px; animation: fadeInUp 0.7s 0.1s ease both;
}
.hero-title .accent { color: var(--yellow); font-style: italic; }
.hero-desc {
  color: rgba(255,255,255,0.75); font-size: 1.05rem; line-height: 1.7;
  margin-bottom: 36px; animation: fadeInUp 0.7s 0.2s ease both;
}
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; animation: fadeInUp 0.7s 0.3s ease both; }
.btn-primary {
  background: var(--orange); color: white; padding: 15px 34px;
  border-radius: 50px; border: none; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: var(--transition); text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(230,95,0,0.4);
}
.btn-primary:hover { background: var(--orange-light); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(230,95,0,0.5); }
.btn-secondary {
  background: rgba(255,255,255,0.1); color: white; padding: 15px 34px;
  border-radius: 50px; border: 1.5px solid rgba(255,255,255,0.3);
  font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition);
  text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  backdrop-filter: blur(4px);
}
.btn-secondary:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
.hero-stats {
  display: flex; gap: 28px; margin-top: 48px;
  animation: fadeInUp 0.7s 0.4s ease both;
}
.hero-stat { text-align: left; }
.hero-stat strong { display: block; font-family: 'Bebas Neue'; font-size: 2rem; color: var(--yellow); letter-spacing: 1px; }
.hero-stat span { font-size: 0.75rem; color: rgba(255,255,255,0.6); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.hero-visual {
  position: absolute; right: 3%; top: 50%; transform: translateY(-50%);
  z-index: 2; animation: floatAnim 4s ease-in-out infinite;
}
.hero-img-wrap {
  width: clamp(320px, 38vw, 560px); height: clamp(320px, 38vw, 560px);
  border-radius: 50%; overflow: hidden;
  border: 6px solid rgba(255,184,0,0.3);
  box-shadow: 0 0 0 20px rgba(255,184,0,0.06), 0 32px 80px rgba(0,0,0,0.4);
}
.hero-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.hero-food-tags { position: absolute; display: flex; flex-direction: column; gap: 10px; }
.hero-food-tags.left { left: -60px; top: 50%; transform: translateY(-50%); }
.hero-food-tags.right { right: -50px; top: 50%; transform: translateY(-50%); }
.food-tag {
  background: rgba(255,255,255,0.95); border-radius: 50px;
  padding: 8px 16px; display: flex; align-items: center; gap: 8px;
  font-size: 0.78rem; font-weight: 600; color: var(--text);
  box-shadow: var(--shadow); white-space: nowrap;
}
.food-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

#how-it-works { background: var(--gray); padding: 80px 5%; }
.section-label {
  text-align: center; color: var(--orange); font-size: 0.78rem;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px;
}
.section-title {
  font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 2.8rem);
  font-weight: 900; text-align: center; color: var(--green-dark); margin-bottom: 12px;
}
.section-sub { text-align: center; color: var(--text-light); font-size: 1rem; max-width: 500px; margin: 0 auto 56px; line-height: 1.7; }
.steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 900px; margin: 0 auto; }
.step-card {
  background: white; border-radius: var(--radius); padding: 36px 28px;
  text-align: center; box-shadow: var(--shadow); transition: var(--transition);
  position: relative; overflow: hidden;
}
.step-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--green), var(--yellow));
}
.step-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
.step-num { font-family: 'Bebas Neue'; font-size: 3.5rem; color: rgba(10,92,54,0.08); line-height: 1; margin-bottom: 8px; }
.step-icon { font-size: 2.4rem; margin-bottom: 14px; }
.step-card h3 { font-size: 1.05rem; font-weight: 700; color: var(--green-dark); margin-bottom: 8px; }
.step-card p { font-size: 0.88rem; color: var(--text-light); line-height: 1.6; }

#categories { background: var(--white); padding: 80px 5%; }
.cats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
.cat-card {
  background: white; border-radius: var(--radius); padding: 28px 20px;
  text-align: center; cursor: pointer; transition: var(--transition);
  box-shadow: 0 2px 16px rgba(0,0,0,0.06); border: 2px solid transparent;
  position: relative; overflow: hidden;
}
.cat-card.active, .cat-card:hover {
  border-color: var(--green); background: linear-gradient(145deg, #f0f9f4, white);
  transform: translateY(-4px); box-shadow: var(--shadow-hover);
}
.cat-card.active .cat-icon, .cat-card:hover .cat-icon { transform: scale(1.15); }
.cat-icon { font-size: 2.6rem; margin-bottom: 10px; transition: var(--transition); display: block; }
.cat-card h3 { font-size: 0.88rem; font-weight: 700; color: var(--text); line-height: 1.3; }
.cat-card span { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; display: block; }

#menu { background: var(--gray); padding: 80px 5%; }
.menu-filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
.filter-btn {
  padding: 9px 22px; border-radius: 50px; border: 1.5px solid var(--gray2);
  background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  transition: var(--transition); color: var(--text-light);
}
.filter-btn.active, .filter-btn:hover { background: var(--green); color: white; border-color: var(--green); }
.food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
.food-card {
  background: white; border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.07); transition: var(--transition);
  cursor: pointer; position: relative;
}
.food-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
.food-img { width: 100%; height: 200px; object-fit: cover; display: block; transition: transform 0.5s ease; }
.food-card:hover .food-img { transform: scale(1.05); }
.food-img-wrap { overflow: hidden; position: relative; }
.food-badge {
  position: absolute; top: 12px; left: 12px;
  background: var(--green); color: white; padding: 4px 12px;
  border-radius: 50px; font-size: 0.72rem; font-weight: 700;
}
.food-badge.spicy { background: var(--orange); }
.food-badge.popular { background: var(--yellow); color: var(--dark); }
.food-fav {
  position: absolute; top: 12px; right: 12px; background: white;
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 1rem; cursor: pointer; transition: var(--transition);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: none;
}
.food-fav:hover { transform: scale(1.15); }
.food-info { padding: 18px 20px 20px; }
.food-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.food-name { font-size: 1rem; font-weight: 700; color: var(--text); }
.food-price { font-size: 1.1rem; font-weight: 800; color: var(--green); white-space: nowrap; }
.food-desc { font-size: 0.82rem; color: var(--text-light); line-height: 1.5; margin-bottom: 12px; }
.food-footer { display: flex; align-items: center; justify-content: space-between; }
.food-time { font-size: 0.75rem; color: var(--text-light); display: flex; align-items: center; gap: 4px; }
.food-rating { display: flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 600; color: var(--text); }
.food-actions { display: flex; gap: 8px; margin-top: 14px; }
.btn-add {
  flex: 1; background: var(--orange); color: white; border: none;
  padding: 10px 0; border-radius: var(--radius-sm); font-size: 0.83rem;
  font-weight: 700; cursor: pointer; transition: var(--transition);
}
.btn-add:hover { background: var(--orange-light); transform: translateY(-1px); }
.btn-view {
  background: transparent; color: var(--green); border: 1.5px solid var(--green);
  padding: 10px 16px; border-radius: var(--radius-sm); font-size: 0.83rem;
  font-weight: 600; cursor: pointer; transition: var(--transition); white-space: nowrap;
}
.btn-view:hover { background: var(--green); color: white; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000;
  display: none; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px); animation: fadeIn 0.2s ease;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: white; border-radius: var(--radius); max-width: 860px; width: 100%;
  max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease;
  box-shadow: 0 32px 80px rgba(0,0,0,0.3);
}
.modal-img { width: 100%; height: 300px; object-fit: cover; display: block; }
.modal-body { padding: 30px; }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--green-dark); }
.modal-price { font-size: 1.5rem; font-weight: 800; color: var(--orange); }
.modal-close {
  position: absolute; top: 16px; right: 16px; background: white;
  border: none; width: 36px; height: 36px; border-radius: 50%;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  display: flex; align-items: center; justify-content: center; z-index: 10;
  transition: var(--transition);
}
.modal-close:hover { background: var(--gray); }
.modal-section-title { font-size: 0.9rem; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px; }
.modal-desc { font-size: 0.93rem; color: var(--text-light); line-height: 1.7; }
.ingredients-list { display: flex; flex-wrap: wrap; gap: 8px; }
.ingredient-tag { background: var(--gray); padding: 5px 14px; border-radius: 50px; font-size: 0.8rem; color: var(--text); font-weight: 500; }
.addons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.addon-item {
  background: var(--gray); border-radius: var(--radius-sm); padding: 12px 14px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: var(--transition); border: 2px solid transparent;
}
.addon-item:hover, .addon-item.selected { border-color: var(--green); background: #e8f5ee; }
.addon-item span { font-size: 0.82rem; font-weight: 600; }
.addon-item strong { font-size: 0.82rem; color: var(--green); }
.nutrition-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.nutrition-item { background: var(--gray); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
.nutrition-item strong { display: block; font-size: 1.2rem; font-weight: 800; color: var(--green); }
.nutrition-item span { font-size: 0.75rem; color: var(--text-light); }
.reviews-list { display: flex; flex-direction: column; gap: 14px; }
.review-item { background: var(--gray); border-radius: var(--radius-sm); padding: 14px 16px; }
.review-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.review-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.85rem; }
.review-name { font-weight: 700; font-size: 0.88rem; }
.review-stars { color: var(--yellow); font-size: 0.8rem; }
.review-text { font-size: 0.83rem; color: var(--text-light); line-height: 1.5; }
.modal-qty { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
.qty-btn { background: var(--gray); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.qty-btn:hover { background: var(--green); color: white; }
.qty-val { font-size: 1.1rem; font-weight: 700; min-width: 28px; text-align: center; }
.modal-add-btn {
  width: 100%; background: var(--orange); color: white; border: none;
  padding: 16px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: var(--transition); margin-top: 8px;
}
.modal-add-btn:hover { background: var(--orange-light); }

.cart-panel {
  position: fixed; top: 0; right: -100%; width: 380px; max-width: 100%; height: 100vh;
  background: white; z-index: 3000; box-shadow: -8px 0 40px rgba(0,0,0,0.15);
  display: flex; flex-direction: column; transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
}
.cart-panel.open { right: 0; }
.cart-header { background: var(--green); color: white; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
.cart-header h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; }
.cart-close { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
.cart-items { flex: 1; overflow-y: auto; padding: 20px; }
.cart-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--gray); align-items: center; }
.cart-item-img { width: 64px; height: 64px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; }
.cart-item-info { flex: 1; }
.cart-item-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
.cart-item-price { font-size: 0.85rem; color: var(--green); font-weight: 700; }
.cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.cart-qty-btn { background: var(--gray); border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.cart-qty-val { font-size: 0.9rem; font-weight: 700; min-width: 20px; text-align: center; }
.cart-item-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; transition: var(--transition); }
.cart-item-remove:hover { color: var(--orange); }
.cart-empty { text-align: center; padding: 60px 20px; color: var(--text-light); }
.cart-empty .empty-icon { font-size: 4rem; margin-bottom: 12px; }
.cart-footer { padding: 20px; border-top: 1px solid var(--gray); }
